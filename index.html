<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Daily Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>ROLLEDLE</h1>
        <p>
            A daily puzzle game - Roll the dice, end over end, adding to your score<br>
            Take care in your moves to achieve the correct score!
        </p>
    </header>

    <main>
            <br><br><br>
            <div id="gameArea">

                <div id="gameInfo">
                    <div id="gameTargetStats">
                        <h4>Target Moves: <span id="targetmoves">0</span></h4>
                        <h3>Target Score: <span id="targetscore">0</span></h3>
                    </div>


                    <div id="rollGuide">
                        <p>Top</p><img id="rollGuideTop" src="Assets/Dice_side1.png" alt="RollTop">
                        <p>Up</p><img id="rollGuideUp" src="Assets/Dice_side1.png" alt="RollUp">
                        <p>Left</p><img id="rollGuideLeft" src="Assets/Dice_side1.png" alt="RollLeft">
                        <p>Right</p><img id="rollGuideRight" src="Assets/Dice_side1.png" alt="RollRight">
                        <p>Down</p><img id="rollGuideDown" src="Assets/Dice_side1.png" alt="RollDown">
                    </div>


                    <div id="gameStats">
                    <h3>Current Move: <span id="rollcount">0</span></h3>
                    <h2>Current Score: <span id="currentscore">0</span></h2>
                    <br>
                    </div>

                </div>

                <div id="diceGrid">
                    <div id="dice">
                        <img id="diceImage" src="Assets/Dice_side1.png" alt="Dice">
                    </div>
                </div>

            </div>
    </main>

    <footer>
        <h3 id="puzzleDate"></h3>
        <p>Daily streak at X!</p>
    </footer>

    <script src="puzzles.js"></script>
    <script src="script.js"></script>

</body>
</html>
