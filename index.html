<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Daily Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADING -->
    <header>
        <h1>ROLLdle</h1>
        <p>
            A daily puzzle game - Roll the dice, end over end, adding to your score<br>
            Take care in your moves to achieve the correct score!
        </p>
    </header>

    <main>
            <br>

            <div id="gameInfo">

                <!-- Game Stats -->
                <div id="gameStats">

                    <div class="statRow">
                        <h3>Current Score</h3>
                        <h3>:</h3>
                        <h3 id="currentscore">0</h3>
                    </div>

                    <div class="statRow">
                        <h3>Target Score</h3>
                        <h3>:</h3>
                        <h3 id="targetscore">29</h3>
                    </div>

                    <div class="statRow">
                        <h3>Current Moves</h3>
                        <h3>:</h3>
                        <h3 id="rollcount">0</h3>
                    </div>

                    <div class="statRow">
                        <h3>Moves Hint</h3>
                        <h3>:</h3>
                        <h3 id="targetmoves">10</h3>
                    </div>

                </div>

                <!-- Dice Grid -->
                <div id="diceGrid">
                    <div id="dice">
                        <img id="diceImage" src="Assets/Dice_side1.png" alt="Dice">
                    </div>
                </div>

                <!-- Roll Guide -->
                <div id="rollGuide">
                    <img id="rollGuideTop" src="Assets/Dice_side1.png" alt="RollTop">
                    <img id="rollGuideUp" src="Assets/Dice_side1.png" alt="RollUp">
                    <img id="rollGuideLeft" src="Assets/Dice_side1.png" alt="RollLeft">
                    <img id="rollGuideRight" src="Assets/Dice_side1.png" alt="RollRight">
                    <img id="rollGuideDown" src="Assets/Dice_side1.png" alt="RollDown">

                    <img id="arrowUp" src="Assets/Arrow_UP.png" alt="Up">
                    <img id="arrowLeft" src="Assets/Arrow_LEFT.png" alt="Left">
                    <img id="arrowRight" src="Assets/Arrow_RIGHT.png" alt="Right">
                    <img id="arrowDown" src="Assets/Arrow_DOWN.png" alt="Down">
                </div>
                
            </div>



    </main>

    <!-- Game Panels -->
    <div id="gameEndPanel">
        <div id="gameEndBox">

            <h2 id="gameEndTitle">Puzzle Complete!</h2>

            <p id="gameEndMessage">
                You solved today's puzzle!
            </p>

            <p id="gameEndStats"></p>

            <button id="gameEndButton" onclick="resetDice()">
                Play Again
            </button>

        </div>
    </div>

    <footer>
        <h3 id="puzzleDate"></h3>
        <p>Daily streak at X!</p>
    </footer>

    <script src="puzzles.js"></script>
    <script src="script.js"></script>

</body>
</html>
