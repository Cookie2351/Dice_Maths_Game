<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Daily Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Dice 'n' Math</h1>
        <p>
            A daily puzzle game - Roll the dice, end over end, adding to your score<br>
            Take care in your moves to achieve the correct score!
        </p>
    </header>

    <main>
        <h2>Game</h2>
        <p>roll the dice...</p>
        <div id="diceGrid">
            <div id="dice"></div>
        </div>
    </main>

    <footer>
        <h3>Date DD/MM/YYYY</h3>
        <p>Daily streak at X!</p>
    </footer>





    <script src="script.js"></script>


</body>
</html>
